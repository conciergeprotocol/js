name: MCP registry

# Lists the version in server.json when a release reached npm but not the registry.
on:
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Publish to the MCP registry
        run: bash scripts/publish-registry.sh
