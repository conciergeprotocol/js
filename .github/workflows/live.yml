name: Live door

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install packages
        run: bun install --frozen-lockfile

      - name: Ask cosmicjs.com
        run: bun run test:live
