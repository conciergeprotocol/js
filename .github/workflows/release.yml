name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'conciergeprotocol/js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and test
        run: |
          bun install --frozen-lockfile
          node --test packages/client/test packages/mcp/test

      - name: Require the tag to match both package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs'
          const version = process.env.TAG.replace(/^v/, '')
          if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(version)) {
            console.error('Tag must look like v0.1.0')
            process.exit(1)
          }
          for (const file of ['packages/client/package.json', 'packages/mcp/package.json']) {
            const found = JSON.parse(readFileSync(file, 'utf8')).version
            if (found !== version) {
              console.error(`${file} is ${found}, and the tag is v${version}`)
              process.exit(1)
            }
          }
          EOF

      - name: Point the MCP package at the published client
        run: node scripts/prepare-publish.mjs

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          else
            unset NODE_AUTH_TOKEN
          fi
          publish() {
            local name="$1"
            local dir="$2"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              return
            fi
            npm publish --access public --provenance --workspace "$dir"
          }
          version="${GITHUB_REF_NAME#v}"
          publish @conciergeprotocol/client packages/client
          publish @conciergeprotocol/mcp packages/mcp
